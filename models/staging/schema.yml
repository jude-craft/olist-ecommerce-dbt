version: 2

models:
  - name: stg_raw_olist__customers
    description: "Staged customer data. Grain: 1 row per customer_id."
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null
      - name: customer_unique_id
        data_tests:
          - not_null

  - name: stg_raw_olist__geolocation
    description: "Brazilian zip codes and coordinates."
    columns:
      - name: zip_code_prefix
        data_tests:
          - not_null

  - name: stg_raw_olist__order_items
    description: "Line items contained within each order. Grain: 1 row per order_item_id."
    columns:
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_raw_olist__orders')
                field: order_id
      - name: order_item_id
        data_tests:
          - not_null
      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_raw_olist__products')
                field: product_id
      - name: seller_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_raw_olist__sellers')
                field: seller_id

  - name: stg_raw_olist__order_payments
    description: "Payment methods and transaction values per order."
    columns:
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_raw_olist__orders')
                field: order_id
      - name: payment_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['credit_card', 'boleto', 'voucher', 'debit_card', 'not_defined']

  - name: stg_raw_olist__order_reviews
    description: "Customer review scores and commentary."
    columns:
      - name: review_id
        data_tests:
          - not_null
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_raw_olist__orders')
                field: order_id
      - name: review_score
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
                quote: false

  - name: stg_raw_olist__orders
    description: "Core order header table."
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_raw_olist__customers')
                field: customer_id
      - name: order_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['delivered', 'shipped', 'canceled', 'unavailable', 'invoiced', 'processing', 'created', 'approved']

  - name: stg_raw_olist__products
    description: "Product dimension table."
    columns:
      - name: product_id
        data_tests:
          - unique
          - not_null

  - name: stg_raw_olist__sellers
    description: "Seller dimension table."
    columns:
      - name: seller_id
        data_tests:
          - unique
          - not_null

  - name: stg_raw_olist__product_category_name_translation
    description: "Portuguese to English category translation lookup."
    columns:
      - name: category_name
        data_tests:
          - unique
          - not_null